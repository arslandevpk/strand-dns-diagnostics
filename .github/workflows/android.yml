name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-34' 'build-tools;34.0.0'
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: strand-dns-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: strand-dns-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: strand-dns-unsigned-release
      - name: Sign and verify the release
        env:
          STRAND_KEYSTORE_BASE64: ${{ secrets.STRAND_KEYSTORE_BASE64 }}
          STRAND_KEYSTORE_PASSWORD: ${{ secrets.STRAND_KEYSTORE_PASSWORD }}
          STRAND_KEY_ALIAS: ${{ secrets.STRAND_KEY_ALIAS }}
          STRAND_KEY_PASSWORD: ${{ secrets.STRAND_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          for setting in STRAND_KEYSTORE_BASE64 STRAND_KEYSTORE_PASSWORD STRAND_KEY_ALIAS STRAND_KEY_PASSWORD; do
            if [[ -z "${!setting}" ]]; then
              printf 'Missing release secret: %s\n' "$setting" >&2
              exit 1
            fi
          done
          tools="$ANDROID_HOME/build-tools/34.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
          fi
          keystore="$(mktemp -p "$RUNNER_TEMP")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$STRAND_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$tools/zipalign" -c 4 app-release-unsigned.apk
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$STRAND_KEY_ALIAS" \
            --ks-pass env:STRAND_KEYSTORE_PASSWORD --key-pass env:STRAND_KEY_PASSWORD \
            --out "strand-dns-${RELEASE_TAG}.apk" app-release-unsigned.apk
          "$tools/apksigner" verify --print-certs "strand-dns-${RELEASE_TAG}.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "strand-dns-${RELEASE_TAG}.apk" --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" "strand-dns-${RELEASE_TAG}.apk" \
              --repo "$GH_REPO" --verify-tag --generate-notes
          fi
